<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f66"/>
      <stop offset="1" stop-color="#23273f"/>
    </linearGradient>
    <linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd66b"/>
      <stop offset="1" stop-color="#ff9d1c"/>
    </linearGradient>
    <linearGradient id="moonG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6eeff"/>
      <stop offset="1" stop-color="#9bbcf6"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00000033"/>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="1024" height="1024" rx="230"/></clipPath>
    <rect id="ray" x="-13" y="-182" width="26" height="52" rx="13" fill="url(#sunG)"/>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- subtle puzzle grid -->
  <g clip-path="url(#round)" stroke="#ffffff" stroke-width="4" opacity="0.08">
    <line x1="256" y1="60" x2="256" y2="964"/>
    <line x1="512" y1="60" x2="512" y2="964"/>
    <line x1="768" y1="60" x2="768" y2="964"/>
    <line x1="60" y1="256" x2="964" y2="256"/>
    <line x1="60" y1="512" x2="964" y2="512"/>
    <line x1="60" y1="768" x2="964" y2="768"/>
  </g>

  <!-- SUN (top-left) -->
  <g filter="url(#soft)" transform="translate(372,372)">
    <g>
      <use href="#ray" transform="rotate(0)"/>
      <use href="#ray" transform="rotate(45)"/>
      <use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(135)"/>
      <use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(225)"/>
      <use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(315)"/>
    </g>
    <circle r="132" fill="url(#sunG)"/>
  </g>

  <!-- MOON (bottom-right) -->
  <g filter="url(#soft)" transform="translate(662,662)">
    <mask id="moonMask">
      <rect x="-220" y="-220" width="440" height="440" fill="black"/>
      <circle r="140" fill="white"/>
      <circle cx="74" cy="-46" r="126" fill="black"/>
    </mask>
    <circle r="140" fill="url(#moonG)" mask="url(#moonMask)"/>
  </g>
</svg>
