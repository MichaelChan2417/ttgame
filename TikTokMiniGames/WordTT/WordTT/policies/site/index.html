<style>
  :root {
    --cream:#F1ECE1; --card:#FFFFFF; --ink:#2b241d; --muted:#8b8375; --line:#E8E1D2;
    --amber:#E4972B; --amber-ink:#8a5a12; --green:#54B96A; --dark:#241C16;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink);
    font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;

  .wrap { max-width:800px; margin:0 auto; padding:0 20px; }
  header { position:sticky; top:0; background:rgba(241,236,225,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); z-index:5; }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:11px; text-decoration:none; color:var(--ink); }
  .brand img { width:40px; height:40px; border-radius:11px; box-shadow:0 3px 8px rgba(36,28,22,.16); }
  .brand b { font-family:"Fredoka",sans-serif; font-weight:600; font-size:17px; letter-spacing:.2px; }
  nav a { font-family:"Fredoka",sans-serif; font-weight:500; color:var(--muted); text-decoration:none; margin-left:16px; font-size:15px; }
  nav a:hover, nav a.active { color:var(--amber-ink); }
  main { padding:30px 0 64px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px;
    box-shadow:0 10px 30px rgba(36,28,22,.06); padding:34px 34px 40px; }
  .tiles { display:flex; gap:8px; margin-bottom:16px; }
  .tiles span { width:30px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-family:"Fredoka",sans-serif; font-weight:700; font-size:18px; box-shadow:0 3px 7px rgba(36,28,22,.16); }
  .tiles .a { background:var(--amber); color:#6e4310; transform:rotate(-7deg); }
  .tiles .b { background:var(--dark); color:#F3ECDD; transform:rotate(3deg); }
  .tiles .c { background:var(--green); color:#14532b; transform:rotate(8deg); }
  h1 { font-family:"Fredoka",sans-serif; font-weight:700; font-size:33px; margin:0 0 4px; letter-spacing:-.3px; }
  .meta, main .card > p:first-of-type { color:var(--muted); font-size:14px; }
  h2 { font-family:"Fredoka",sans-serif; font-weight:600; font-size:20px; margin:30px 0 9px; padding-top:22px;
    border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  h2::before { content:""; width:13px; height:13px; border-radius:5px; background:var(--amber); flex:none;
    box-shadow:0 2px 4px rgba(228,151,43,.4); }
  a { color:var(--amber-ink); }
  strong { color:var(--ink); }
  ul { padding-left:22px; }
  li { margin:6px 0; }
  li::marker { color:var(--amber); }
  hr { border:none; border-top:1px solid var(--line); margin:30px 0; }
  em { color:var(--muted); font-size:13px; }
  footer { color:var(--muted); font-size:13px; text-align:center; padding:22px; }
